---
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_acap:
    name: Build ACAP applications
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.0
      # Test all Makefile targets and make sure the ACAP files are created
      - name: Build
        run: make -j dockerbuild
      - name: Verify
        run: |
          for f in *.eap; do
          echo "Verification of $f:"
          tar tzf "$f"
          done
      - name: Clean
        run: |
          make clean
          echo 'Make sure no ACAP files are left:'
          [ -z "$(ls ./*.eap ./*LICENSE.txt)" ]
